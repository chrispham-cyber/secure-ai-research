# Minimal OpenTelemetry Collector config for local development (monitoring profile).
# Receives OTLP over gRPC/HTTP and logs it. Replace the debug exporter with a real
# backend (e.g. Tempo/Jaeger/Prometheus) when telemetry work begins (ROADMAP Phase 6).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
