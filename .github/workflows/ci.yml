name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint · type · unit · supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (type check)
        run: mypy src

      - name: Pytest (unit only — no live services)
        run: pytest -m "not integration"

      - name: pip-audit (advisory report, non-gating)
        continue-on-error: true
        run: pip-audit

      # Reproducible release SBOM from the pinned lock + SHA-256 integrity manifest.
      # The drift/completeness gate is the pytest step above (tests/test_sbom.py); this
      # step only refreshes the uploaded artifact, so it stays advisory.
      - name: SBOM (reproducible release)
        continue-on-error: true
        run: python -m secure_ai_research.supply_chain.sbom

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: ignore

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the compose file
        run: docker compose config -q
